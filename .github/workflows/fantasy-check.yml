name: Fantasy dry-run manager
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 2"
    - cron: "0 22 * * 4"
    - cron: "0 14 * * 0"
    - cron: "0 18 * * 0"
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run agent:dry
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: "1318109236"
          ESPN_TEAM_ID: "6"
          ESPN_SEASON: "2026"
          ESPN_SPORT: ffl
          WRITES_ENABLED: "false"
          AUTO_EXECUTE: "false"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fantasy-report
          path: reports/latest.json
          if-no-files-found: ignore
